<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EduExam</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/amazon-cognito-identity.js/6.3.12/amazon-cognito-identity.min.js"></script>
</head>
<body>
  <header>
    <h1>EduExam</h1>
    <span id="whoami"></span>
  </header>

  <main>
    <section id="login-view">
      <h2>Sign in</h2>
      <form id="login-form">
        <label>Email <input type="email" id="login-email" required /></label>
        <label>Password <input type="password" id="login-password" required /></label>
        <button type="submit">Sign in</button>
      </form>
      <p id="login-error" class="error"></p>
    </section>

    <section id="exam-view" hidden>
      <h2>Exam</h2>
      <label>Exam ID <input type="text" id="exam-id" placeholder="e.g. exam-101" /></label>
      <button id="open-exam-btn">Open exam</button>
      <div id="exam-content" hidden>
        <h3 id="exam-title"></h3>
        <p>Time remaining: <span id="time-remaining"></span>s</p>
        <div id="questions"></div>
        <p id="autosave-status"></p>
        <button id="submit-exam-btn">Submit exam</button>
      </div>
    </section>

    <section id="upload-view">
      <h2>Upload assignment</h2>
      <label>Assignment ID <input type="text" id="assignment-id" placeholder="e.g. assign-55" /></label>
      <input type="file" id="file-input" accept=".pdf,.zip" />
      <button id="upload-btn">Upload</button>
      <progress id="upload-progress" value="0" max="100" hidden></progress>
      <p id="upload-status"></p>
    </section>

    <section id="tutor-view">
      <h2>Tutor: release results</h2>
      <label>Exam ID <input type="text" id="release-exam-id" /></label>
      <button id="release-btn">Release results</button>
      <p id="release-status"></p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
