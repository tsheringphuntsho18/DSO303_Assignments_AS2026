name: Deploy EduExam

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC -> AWS
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VAR_github_repo: ${{ github.repository }}

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Install Lambda dependencies
        run: |
          for dir in app/api/*/ app/workers/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Installing deps for $dir"
              (cd "$dir" && npm install --omit=dev --no-audit --no-fund)
            fi
          done

      - name: Terraform fmt check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -out=tfplan -var="domain_name=${{ vars.DOMAIN_NAME }}" -var="hosted_zone_id=${{ vars.HOSTED_ZONE_ID }}" -var="alarm_email=${{ vars.ALARM_EMAIL }}"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 1

  apply:
    name: Terraform apply + deploy frontend
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Install Lambda dependencies
        run: |
          for dir in app/api/*/ app/workers/*/; do
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && npm install --omit=dev --no-audit --no-fund)
            fi
          done

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve -var="domain_name=${{ vars.DOMAIN_NAME }}" -var="hosted_zone_id=${{ vars.HOSTED_ZONE_ID }}" -var="alarm_email=${{ vars.ALARM_EMAIL }}"

      - name: Capture Terraform outputs
        id: tf
        working-directory: infra
        run: |
          echo "frontend_bucket=$(terraform output -raw frontend_bucket)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_domain=$(terraform output -raw cloudfront_domain)" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies and build
        working-directory: app/frontend
        run: |
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
            npm run build --if-present
          fi

      - name: Sync frontend to S3
        run: |
          SRC="app/frontend/dist"
          [ -d "$SRC" ] || SRC="app/frontend" # fall back to plain static files if there's no build step
          aws s3 sync "$SRC" "s3://${{ steps.tf.outputs.frontend_bucket }}" --delete

      - name: Get CloudFront distribution ID
        id: cf
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DomainName=='${{ steps.tf.outputs.cloudfront_domain }}'].Id" \
            --output text)
          echo "dist_id=$DIST_ID" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ steps.cf.outputs.dist_id }} --paths "/*"

      - name: Deployment summary
        run: |
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: https://${{ steps.tf.outputs.cloudfront_domain }}" >> "$GITHUB_STEP_SUMMARY"
